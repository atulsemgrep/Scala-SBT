name: Semgrep SCA

on:
  workflow_dispatch: {}

  pull_request: {}

  push:
    branches:
      - main
      - master

  schedule:
    # Random HH:MM to avoid GitHub Actions load spikes
    - cron: "34 5 * * *"

jobs:
  semgrep-the-sca:
    name: semgrep/ci
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: sbtscala/scala-sbt:eclipse-temurin-17.0.15_6_1.12.11_3.3.7

    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark repository as safe 
        run: | 
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install dependencies and Semgrep
        run: |
          apt-get update

          apt-get install -y --no-install-recommends \
            python3 \
            python3-pip \
            pipx \
            ca-certificates \
            git

          pipx install semgrep

          echo "/github/home/.local/bin" >> $GITHUB_PATH

          /github/home/.local/bin/semgrep --version
          sbt --version

      - name: Run Semgrep SCA
        run: |
          semgrep ci \
            --supply-chain \
            --allow-local-builds \
            --include='build.sbt' \
            --verbose \
            --json \
            --output=report-ssc.json || true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-ssc
          path: report-ssc.json
